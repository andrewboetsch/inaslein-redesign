name: Verify pull requests
on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify all locked Sharp copies and installed version
        run: node scripts/verify-sharp-lock.mjs
      - name: Verify static export, types, lint, and content
        run: npm run verify
        env:
          GITHUB_PAGES: 'true'
