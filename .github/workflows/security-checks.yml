name: Verify pull requests
on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify all locked Sharp copies and installed version
        run: node scripts/verify-sharp-lock.mjs
      - name: Verify static export, types, lint, and content
        run: npm run verify
        env:
          GITHUB_PAGES: 'true'
