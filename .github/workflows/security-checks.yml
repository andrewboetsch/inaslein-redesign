name: Verify pull requests
on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Confirm patched sharp version
        run: node -e "if (require('sharp').versions.sharp !== '0.35.5') process.exit(1)"
      - name: Verify static export, types, lint, and content
        run: npm run verify
        env:
          GITHUB_PAGES: 'true'
